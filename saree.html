<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Saree Mirror · Shreshta Collections</title><style>
*{box-sizing:border-box}body{margin:0;background:#151018;color:white;font-family:system-ui}header{padding:10px 14px;display:flex;justify-content:space-between;align-items:center;background:#241827}a{color:#f5d5ef}.mirror{height:calc(100dvh - 166px);position:relative;background:#08070a;overflow:hidden}video,canvas{position:absolute;width:100%;height:100%;inset:0}video{object-fit:contain;transform:scaleX(-1)}canvas{pointer-events:none}.status{position:absolute;top:12px;left:12px;background:#241827aa;border-radius:8px;padding:8px;max-width:80%;font-size:13px}footer{height:110px;background:#241827;padding:8px;display:flex;flex-wrap:wrap;gap:7px;align-content:center}button,.upload{background:#d9b5cf;border:0;border-radius:9px;padding:9px 12px;color:#231525;font-weight:700;font-size:13px}button:disabled{opacity:.5}.upload input{display:none}.note{font-size:11px;color:#e7d5e4;width:100%}select{padding:8px;border-radius:8px;background:#f3e2ee;color:#221727}</style></head><body><header><strong>Shreshta Collections · Saree Mirror</strong><a href="/">Jewellery mirror</a></header><div class="mirror" id="mirror"><video id="camera" autoplay playsinline muted></video><canvas id="overlay"></canvas><div class="status" id="status">Stand back so your full body fits in the guide.</div></div><footer><button id="start">Start full-body mirror</button><button id="stop" disabled>Stop</button><select id="saree" aria-label="Select saree"><option value="rose">Rose silk (demo)</option><option value="teal">Teal silk (demo)</option><option value="gold">Gold silk (demo)</option></select><label class="upload">Use saree photo<input type="file" id="fabric" accept="image/png,image/jpeg,image/webp"></label><label><input type="checkbox" id="guide" checked> Outline</label><span class="note">Early 2D drape preview, not actual fabric simulation. Camera stays on device; selected photo is not uploaded.</span></footer><script type="module" src="/saree.js"></script></body></html>
